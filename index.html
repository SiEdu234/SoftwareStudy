<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias | Estudien Vagos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="dashboard">
    <div class="app-container">
        <!-- HEADER -->
        <header class="sys-header">
            <div class="sys-header-top">
                <a href="index.html" class="sys-logo">
                    <i class="ph-fill ph-terminal-window"></i>
                    <h1>ESTUDIEN VAGOS</h1>
                </a>
                <nav class="sys-header-actions" aria-label="Navegación principal">
                    <a href="index.html" class="btn secondary small active-nav">
                        <i class="ph ph-books"></i> Materias
                    </a>
                    <a href="prompts.html" class="btn secondary small">
                        <i class="ph ph-sparkle"></i> Prompts & Guía IA
                    </a>
                </nav>
            </div>
            <div class="sys-marquee">
                <div class="marquee-content">
                    <span>// CONSOLA DE ESTUDIO MULTIPÁGINA</span>
                    <span>// CARGA LIGERA Y RÁPIDA</span>
                    <span>// MODO PRÁCTICA Y REPASO</span>
                    <span>// GENERACIÓN CON IA</span>
                </div>
            </div>
        </header>

        <main id="main-content" class="sys-main">
            <section class="view active fade-in">
                <div class="section-header">
                    <div class="header-left">
                        <div class="status-dot"></div>
                        <div>
                            <h2>Materias</h2>
                            <p id="dashboard-stats" class="sys-text">Cargando banco de estudio...</p>
                        </div>
                    </div>
                    <div class="section-actions">
                        <div class="search-box">
                            <i class="ph ph-magnifying-glass"></i>
                            <input type="search" id="search-subjects" placeholder="Buscar materia..." autocomplete="off">
                        </div>
                        <button id="btn-toggle-create" class="btn primary">
                            <i class="ph ph-plus-circle"></i> Nueva materia
                        </button>
                    </div>
                </div>

                <!-- Inline Form for Creating a Subject (replaces blocking prompt) -->
                <form id="create-subject-form" class="inline-create-bar hidden">
                    <div class="inline-create-input">
                        <i class="ph ph-folder-plus"></i>
                        <input type="text" id="new-subject-name" placeholder="Ej: Ingeniería de Software II, Redes, Cálculo..." maxlength="120" required>
                    </div>
                    <div class="inline-create-actions">
                        <button type="submit" id="btn-submit-subject" class="btn primary small">
                            <i class="ph ph-check"></i> Crear
                        </button>
                        <button type="button" id="btn-cancel-subject" class="btn secondary small">
                            Cancelar
                        </button>
                    </div>
                </form>

                <div id="subjects-grid" class="data-grid">
                    <div class="skeleton-grid">
                        <div class="sys-card skeleton-card"></div>
                        <div class="sys-card skeleton-card"></div>
                        <div class="sys-card skeleton-card"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="sys-toast hidden">
        <i class="ph ph-info"></i>
        <span class="toast-msg">Mensaje del sistema</span>
    </div>

    <script src="script.js"></script>
</body>

</html>
